<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Correlation function imaging</title>
  <desc id="desc">A stylized correlation curve mapped into a reconstructed source profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#edf7f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#4a3b22" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <g transform="translate(80 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="312" height="226" rx="8" fill="#ffffff" stroke="#e1ded7" stroke-width="2"/>
    <path d="M50 174 H274" stroke="#98a1af" stroke-width="3"/>
    <path d="M50 174 V44" stroke="#98a1af" stroke-width="3"/>
    <path d="M55 151 C83 85, 118 73, 146 122 C178 178, 213 118, 264 101" fill="none" stroke="#b7791f" stroke-width="7" stroke-linecap="round"/>
    <path d="M55 151 C83 85, 118 73, 146 122 C178 178, 213 118, 264 101" fill="none" stroke="#fff2c7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="101" cy="88" r="6" fill="#5a2675"/>
    <circle cx="146" cy="122" r="6" fill="#5a2675"/>
    <circle cx="210" cy="124" r="6" fill="#5a2675"/>
    <text x="50" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#626b7a">q</text>
    <text x="26" y="49" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#626b7a">C(q)</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M422 204 C466 204, 490 204, 535 204" stroke="#5a2675" stroke-width="7"/>
    <path d="M518 183 l23 21 l-23 21" stroke="#5a2675" stroke-width="7"/>
  </g>
  <g transform="translate(584 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="254" height="254" rx="8" fill="#ffffff" stroke="#dfe5e2" stroke-width="2"/>
    <g transform="translate(127 127)">
      <ellipse cx="0" cy="0" rx="87" ry="42" fill="#e4f2ef"/>
      <ellipse cx="0" cy="0" rx="61" ry="30" fill="#bfe1da"/>
      <ellipse cx="0" cy="0" rx="34" ry="17" fill="#0f766e" opacity="0.82"/>
      <path d="M-101 0 H101 M0 -101 V101" stroke="#dde4e9" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#5a2675"/>
      <path d="M-73 -45 C-34 -72, 33 -74, 76 -43" fill="none" stroke="#b7791f" stroke-width="4"/>
      <path d="M-73 45 C-34 72, 33 74, 76 43" fill="none" stroke="#b7791f" stroke-width="4"/>
    </g>
    <text x="38" y="231" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#626b7a">source profile S(r)</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#2d3340">
    <text x="54" y="374" font-size="23" font-weight="700">correlation function imaging</text>
    <text x="54" y="399" font-size="17" fill="#626b7a">from measured correlations to source structure</text>
  </g>
</svg>
