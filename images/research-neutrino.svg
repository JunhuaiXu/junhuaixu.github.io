<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Atmospheric neutrino simulation</title>
  <desc id="desc">A stylized atmosphere, neutrino track, deep-sea detector strings, and reconstruction signals.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8fb"/>
      <stop offset="0.52" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f3fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7f4"/>
      <stop offset="1" stop-color="#eaf1ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="420" fill="url(#sky)"/>
  <path d="M0 130 C126 99, 237 154, 354 126 C488 93, 587 127, 700 110 C779 98, 836 82, 900 91 L900 0 L0 0 Z" fill="#d6eef7"/>
  <path d="M0 258 C122 238, 249 280, 381 253 C528 223, 658 272, 900 235 L900 420 L0 420 Z" fill="url(#sea)"/>
  <path d="M99 36 C203 96, 305 153, 403 205 C486 249, 568 281, 694 321" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <path d="M676 310 l-34 -5 M676 310 l-20 -28" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#1d4f91" stroke-width="4" opacity="0.58">
    <path d="M132 263 L132 380"/>
    <path d="M242 244 L242 392"/>
    <path d="M352 258 L352 385"/>
    <path d="M462 239 L462 398"/>
    <path d="M572 253 L572 382"/>
    <path d="M682 235 L682 394"/>
  </g>
  <g fill="#ffffff" stroke="#1d4f91" stroke-width="3">
    <circle cx="132" cy="286" r="11"/>
    <circle cx="132" cy="326" r="11"/>
    <circle cx="132" cy="366" r="11"/>
    <circle cx="242" cy="273" r="11"/>
    <circle cx="242" cy="318" r="11"/>
    <circle cx="242" cy="363" r="11"/>
    <circle cx="352" cy="291" r="11"/>
    <circle cx="352" cy="331" r="11"/>
    <circle cx="352" cy="371" r="11"/>
    <circle cx="462" cy="268" r="11"/>
    <circle cx="462" cy="318" r="11"/>
    <circle cx="462" cy="368" r="11"/>
    <circle cx="572" cy="288" r="11"/>
    <circle cx="572" cy="328" r="11"/>
    <circle cx="572" cy="368" r="11"/>
    <circle cx="682" cy="265" r="11"/>
    <circle cx="682" cy="314" r="11"/>
    <circle cx="682" cy="363" r="11"/>
  </g>
  <g filter="url(#glow)" fill="#f2b84b" opacity="0.95">
    <circle cx="462" cy="318" r="15"/>
    <circle cx="572" cy="328" r="13"/>
    <circle cx="682" cy="314" r="12"/>
    <circle cx="352" cy="331" r="10"/>
  </g>
  <g fill="none" stroke="#5a2675" stroke-width="3" opacity="0.68">
    <path d="M415 313 C462 289, 540 287, 609 318"/>
    <path d="M420 337 C489 366, 562 364, 650 333"/>
    <path d="M382 289 C448 239, 542 242, 622 289"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#2d3340">
    <text x="54" y="74" font-size="23" font-weight="700">atmospheric neutrino simulation</text>
    <text x="54" y="101" font-size="17" fill="#626b7a">flux, interaction, detector response, reconstruction</text>
  </g>
</svg>
