<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Short-range correlations in nuclei</title>
  <desc id="desc">A stylized nucleus with highlighted close nucleon pairs and outgoing reaction fragments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6fc"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b2b4d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <path d="M84 329 C190 224, 259 168, 402 188 C526 205, 586 99, 728 74" fill="none" stroke="#d7c7e2" stroke-width="3" stroke-dasharray="10 12"/>
  <path d="M167 81 C248 157, 314 202, 438 173 C580 141, 627 232, 802 290" fill="none" stroke="#c7dbef" stroke-width="3" stroke-dasharray="8 13"/>
  <g transform="translate(448 213)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="176" ry="130" fill="#ffffff" stroke="#d8dce6" stroke-width="3"/>
    <g opacity="0.96">
      <circle cx="-91" cy="-38" r="29" fill="#5a2675"/>
      <circle cx="-40" cy="-52" r="27" fill="#1d4f91"/>
      <circle cx="14" cy="-71" r="25" fill="#7e4c99"/>
      <circle cx="76" cy="-42" r="30" fill="#2367ad"/>
      <circle cx="-125" cy="19" r="31" fill="#2367ad"/>
      <circle cx="-69" cy="17" r="28" fill="#7e4c99"/>
      <circle cx="-14" cy="8" r="31" fill="#5a2675"/>
      <circle cx="42" cy="17" r="28" fill="#1d4f91"/>
      <circle cx="107" cy="23" r="31" fill="#7e4c99"/>
      <circle cx="-73" cy="76" r="27" fill="#1d4f91"/>
      <circle cx="-12" cy="70" r="29" fill="#2367ad"/>
      <circle cx="52" cy="78" r="27" fill="#5a2675"/>
    </g>
    <g>
      <line x1="-91" y1="-38" x2="-40" y2="-52" stroke="#f2b84b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-91" cy="-38" r="35" fill="none" stroke="#f2b84b" stroke-width="5"/>
      <circle cx="-40" cy="-52" r="33" fill="none" stroke="#f2b84b" stroke-width="5"/>
      <line x1="-14" y1="8" x2="42" y2="17" stroke="#f2b84b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-14" cy="8" r="37" fill="none" stroke="#f2b84b" stroke-width="5"/>
      <circle cx="42" cy="17" r="34" fill="none" stroke="#f2b84b" stroke-width="5"/>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M618 170 C690 129, 741 111, 823 104" stroke="#5a2675" stroke-width="7"/>
    <path d="M606 241 C684 265, 743 297, 811 351" stroke="#1d4f91" stroke-width="7"/>
    <path d="M292 184 C214 151, 157 122, 92 72" stroke="#0f766e" stroke-width="7"/>
    <path d="M810 104 l-25 -14 M810 104 l-23 18" stroke="#5a2675" stroke-width="7"/>
    <path d="M811 351 l-31 -2 M811 351 l-12 -28" stroke="#1d4f91" stroke-width="7"/>
    <path d="M92 72 l13 29 M92 72 l31 -3" stroke="#0f766e" stroke-width="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#2d3340">
    <text x="54" y="374" font-size="23" font-weight="700">short-range correlated pairs</text>
    <text x="54" y="399" font-size="17" fill="#626b7a">reaction observables and detector response</text>
  </g>
